# Blaue Stunde (blauestunde.media) on Daniel's VPS (D-87): /etc/nginx/sites-available/blauestunde.media,
# linked from sites-enabled. The files come from the pull-deploy (deploy/vps-deploy.sh).
# Mirrors the site's .htaccess, which nginx does not read. Certificate by certbot (renews by itself).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blauestunde.media www.blauestunde.media;

    ssl_certificate /etc/letsencrypt/live/blauestunde.media/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blauestunde.media/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/blauestunde.media/public;
    index index.html;

    access_log /var/log/nginx/blauestunde.access.log;
    error_log  /var/log/nginx/blauestunde.error.log;

    # one address: https and without www (D-83)
    if ($host = www.blauestunde.media) { return 301 https://blauestunde.media$request_uri; }

    # staging: noindex while the build's .staging marker exists (the launch package has none)
    set $robots "";
    if (-f $document_root/.staging) { set $robots "noindex, nofollow"; }
    add_header X-Robots-Tag $robots always;

    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # the site's own page for missing addresses (404.html, absolute paths)
    error_page 404 /404.html;

    # no dotfiles (.htaccess, .staging, .git); the mail library is only included by api/senden.php
    location ~ /\. { deny all; }
    location ^~ /api/lib/ { deny all; }

    # the form (D-04); its config sits above the web root (mail-config.php)
    location ~ ^/api/[a-z-]+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }

    # caching: CSS and JS are versioned by ?v= in the pages; fonts never change; frames and
    # images are unversioned (P8), so a month; HTML always fresh
    location ~* \.(css|js|woff2)$ { expires 1y; }
    location ~* \.(webp|png|jpe?g|svg|ico)$ { expires 30d; }
    location = /site.webmanifest { default_type application/manifest+json; }

    location / {
        expires 0;
        try_files $uri $uri/ =404;
    }
}

# http, with or without www → https without www, in one redirect
server {
    listen 80;
    listen [::]:80;
    server_name blauestunde.media www.blauestunde.media;
    return 301 https://blauestunde.media$request_uri;
}
